[project]
name = "whale-reproduction"
version = "0.1.0"
description = "WHALE 复现：RecFlow long_view 预测"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jackknifer"}]
keywords = ["recommendation", "WHALE", "RecFlow", "PyTorch", "reproduction"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.13.0",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "pyarrow>=18,<27",
    "duckdb>=1.4,<2",
    "scikit-learn>=1.7,<2",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whale_reproduction"]

[tool.hatch.build.targets.sdist]
include = [
    "src/whale_reproduction", "scripts", "configs", "results", "LICENSES",
    "docs/research.md", "docs/experiment.md", "README.md", "LICENSE", "NOTICE",
    "CITATION.cff", "pyproject.toml", "uv.lock", ".python-version",
    ".gitignore", ".gitattributes", ".github",
]

[tool.uv]
package = true
