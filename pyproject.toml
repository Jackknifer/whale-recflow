[project]
name = "whale-reproduction"
version = "0.1.0"
description = "WHALE 复现：RecFlow long_view 预测"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "README.md"]
authors = [{name = "Jackknifer"}]
keywords = ["recommendation", "WHALE", "RecFlow", "PyTorch", "reproduction"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.13.0",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "pyarrow>=18,<27",
    "scikit-learn>=1.7,<2",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "src", "scripts", "configs", "results",
    "README.md", "LICENSE",
    "pyproject.toml", "uv.lock",
    ".gitignore", ".gitattributes",
]

[tool.uv]
package = true
